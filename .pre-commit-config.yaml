repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (skill package)
        entry: uv run mypy .agents/skills/phase6/scripts/pyphase6
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit (skill scripts)
        entry: uv run bandit -r .agents/skills/phase6/scripts -q
        language: system
        types: [python]
        pass_filenames: false
