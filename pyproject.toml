[project]
name = "pyphase6"
version = "1.1.0"
description = "Python client and CLI for managing vocabulary in the Phase-6 web application, packaged as an agent skill"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
    "playwright==1.62.0",
    "pydantic==2.13.4",
    "rich==14.3.4",
    "typer==0.27.1",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "python-semantic-release==10.6.1",
    "ruff==0.16.3",
]

[project.scripts]
pyphase6 = "pyphase6.__main__:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = [".agents/skills/phase6/tests"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".agents/skills/phase6/scripts/pyphase6"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv build"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
